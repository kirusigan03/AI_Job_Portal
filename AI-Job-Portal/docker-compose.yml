services:
  postgres:
    image: postgres:17
    container_name: smartjob-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:latest
    container_name: smartjob-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartjob-eureka
    restart: on-failure
    ports:
      - "8761:8761"

  config-server:
    build:
      context: ./config-server
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartjob-config-server
    restart: on-failure
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_started

  auth-service:
    build:
      context: ./auth-service
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartjob-auth-service
    restart: on-failure
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartjob-user-service
    restart: on-failure
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy

  job-service:
    build:
      context: ./job-service
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartjob-job-service
    restart: on-failure
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy

  resume-service:
    build:
      context: ./resume-service
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartjob-resume-service
    restart: on-failure
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    volumes:
      - resume_uploads:/app/uploads/resumes
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy

  application-service:
    build:
      context: ./application-service
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartjob-application-service
    restart: on-failure
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartjob-ai-service
    restart: on-failure
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    build:
      context: ./notification-service
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartjob-notification-service
    restart: on-failure
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ../docker/backend.Dockerfile
    container_name: smartjob-api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  frontend:
    image: ai-job-portal-frontend:latest
    container_name: smartjob-frontend
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  postgres_data:
  resume_uploads:
