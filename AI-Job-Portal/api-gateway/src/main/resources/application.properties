spring.application.name=api-gateway
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
server.port=8080
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,Accept
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=false
spring.codec.max-in-memory-size=10MB
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[2].id=job-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://JOB-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/jobs/**
spring.cloud.gateway.server.webflux.routes[3].id=application-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/applications/**
spring.cloud.gateway.server.webflux.routes[4].id=resume-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://RESUME-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/resumes/**
spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webflux.routes[6].id=ai-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://AI-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/ai/**

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
